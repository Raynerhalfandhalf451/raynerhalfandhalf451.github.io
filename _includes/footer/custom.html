<!-- ===== Dark/Light Mode Toggle ===== -->
<script>
(function() {
  const STORAGE_KEY = "mm_theme";
  const html = document.documentElement;

  function getTheme() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored === "light" || stored === "dark") return stored;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  function setTheme(theme) {
    html.setAttribute("data-theme", theme);
    localStorage.setItem(STORAGE_KEY, theme);
    const btn = document.getElementById("theme-toggle-btn");
    if (btn) {
      btn.innerHTML = theme === "dark"
        ? `<i class="fas fa-sun"></i>`
        : `<i class="fas fa-moon"></i>`;
      btn.setAttribute("aria-label", theme === "dark" ? "切换到亮色模式" : "切换到暗色模式");
    }
    const iframe = document.querySelector('iframe.giscus-frame');
    if (iframe) {
      iframe.contentWindow.postMessage({
        giscus: { setConfig: { theme: theme === "dark" ? "dark" : "light" } }
      }, "https://giscus.app");
    }
  }

  setTheme(getTheme());

  document.addEventListener("DOMContentLoaded", function() {
    const nav = document.querySelector(".greedy-nav .visible-links");
    if (nav) {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.id = "theme-toggle-btn";
      btn.className = "btn btn--primary btn--small";

      btn.addEventListener("click", function() {
        const current = html.getAttribute("data-theme");
        setTheme(current === "dark" ? "light" : "dark");
      });
      li.appendChild(btn);
      nav.appendChild(li);

      const initial = getTheme();
      btn.innerHTML = initial === "dark"
        ? `<i class="fas fa-sun"></i>`
        : `<i class="fas fa-moon"></i>`;
    }
  });
})();
</script>

<style>
/* ===== Back to Top Button ===== */
#back-to-top {
  position: fixed;
  right: 20px;
  bottom: 90px;
  z-index: 9998;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(16px) saturate(1.4);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 4px 20px rgba(255, 140, 158, 0.2);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  color: #B388EB;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  opacity: 0;
  transform: translateY(20px) scale(0.8);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

#back-to-top.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

#back-to-top:hover {
  transform: translateY(-3px) scale(1.1);
  box-shadow: 0 8px 28px rgba(255, 140, 158, 0.35);
}

/* Dark mode */
[data-theme="dark"] #back-to-top {
  background: rgba(30, 18, 42, 0.55);
  border-color: rgba(255, 255, 255, 0.12);
  color: #C9B0D9;
  box-shadow: 0 4px 20px rgba(179, 136, 235, 0.15);
}

[data-theme="dark"] #back-to-top:hover {
  box-shadow: 0 8px 28px rgba(179, 136, 235, 0.25);
}
</style>

<button id="back-to-top" aria-label="回到顶部">↑</button>

<script>
(function() {
  const btn = document.getElementById("back-to-top");
  if (!btn) return;

  window.addEventListener("scroll", function() {
    if (window.scrollY > 400) {
      btn.classList.add("visible");
    } else {
      btn.classList.remove("visible");
    }
  }, { passive: true });

  btn.addEventListener("click", function() {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
