# Hexo Configuration
title: "我的博客"
subtitle: "记录技术、分享思考、探索世界"
description: "一个关于技术、编程和生活的个人博客。"
author: "Jay Chou"
language: zh-CN
timezone: "Asia/Shanghai"

url: "https://jaychou8421-cpu.github.io"
root: "/"
permalink: ":year/:month/:day/:title/"
permalink_defaults:
pretty_urls:
  trailing_index: true

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ":lang"
skip_render:

new_post_name: ":title.md"
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

highlight:
  enable: false

prismjs:
  enable: false

# Use anzhiyu theme
theme: anzhiyu

deploy:
  type: ""
