# =========================================================
#  Jekyll + Minimal Mistakes Configuration
#  https://mmistakes.github.io/minimal-mistakes/
# =========================================================

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

# ---- Site Settings ----
title: "My Blog"
subtitle: "Thoughts, stories, and ideas."
name: "My Blog"
description: "A personal blog about technology, programming, and life."
locale: "zh-CN"
url: "https://jaychou8421-cpu.github.io"
baseurl: ""
repository: "jaychou8421-cpu/jaychou8421-cpu.github.io"
teaser:  # path to fallback teaser image

# ---- Reading Files ----
include:
  - _pages

# ---- Conversion ----
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# ---- Permalinks ----
permalink: /posts/:title/

# ---- Collections ----
collections:
  posts:
    output: true

# ---- Defaults ----
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# ---- Author ----
author:
  name: "The Author"
  avatar:  # "/assets/images/avatar.jpg"
  bio: "A passionate developer and tech enthusiast."
  location: "China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychou8421-cpu"

# ---- Footer ----
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychou8421-cpu"
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

# ---- Search ----
search: true
search_full_content: false

# ---- Archives ----
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: archive-taxonomy
  permalinks:
    tag: /tags/:name/

# ---- Analytics ----
analytics:
  provider: false

# ---- Comments ----
comments:
  provider: false

# ---- Plugins ----
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives

# ---- Pagination ----
paginate: 5
paginate_path: /page:num/

# ---- Atom Feed ----
atom_feed:
  path: "/feed.xml"
