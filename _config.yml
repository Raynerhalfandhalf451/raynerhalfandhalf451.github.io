# =========================================================
#  Jekyll + Minimal Mistakes Configuration
#  https://mmistakes.github.io/minimal-mistakes/
# =========================================================

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# ---- Site Settings ----
title: "My Blog"
subtitle: "Thoughts, stories, and ideas."
name: "My Blog"
description: "A personal blog about technology, programming, and life."
locale: "zh-CN"
url: "https://jaychou8421-cpu.github.io"
baseurl: ""
repository: "jaychou8421-cpu/jaychou8421-cpu.github.io"
teaser: "/assets/images/teaser.jpg"

# ---- Reading Files ----
include:
  - _pages

# ---- Conversion ----
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge

# ---- Permalinks ----
permalink: /posts/:title/

# ---- Collections ----
collections:
  posts:
    output: true

# ---- Defaults ----
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      show_date: true
      comments: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

# ---- Author ----
author:
  name: "Jay Chou"
  avatar: "/assets/images/avatar.jpg"
  bio: "A passionate developer and tech enthusiast. Exploring web dev, design, and everything in between."
  location: "China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychou8421-cpu"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:jaychou8421-cpu@users.noreply.github.com"
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

# ---- Footer ----
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/jaychou8421-cpu"
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"

# ---- Search ----
search: true
search_full_content: false
search_provider: lunr

# ---- Archives ----
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: archive-taxonomy
    category: archive-taxonomy
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# ---- Comments ----
comments:
  provider: giscus
giscus:
  repo: "jaychou8421-cpu/jaychou8421-cpu.github.io"
  repo_id: ""
  category: "Announcements"
  category_id: ""
  theme: "preferred_color_scheme"
  lang: "zh-CN"

# ---- Analytics ----
analytics:
  provider: "custom"

# ---- Plugins ----
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-archives

# ---- Pagination ----
paginate: 5
paginate_path: /page:num/

# ---- Atom Feed ----
atom_feed:
  path: "/feed.xml"

# ---- Default Skin Override ----
# The dark/light toggle is handled client-side via assets/css/custom.css
